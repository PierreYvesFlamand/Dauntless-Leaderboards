<header class="sticky top-0 z-20 border-b border-line bg-bg/80 backdrop-blur-md">
    <div class="mx-auto flex h-16 w-full max-w-7xl items-center gap-2 px-4 sm:px-6 lg:px-8">
        <button class="btn-icon -ml-2 lg:hidden" (click)="toggleSidebar.emit()" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a routerLink="/" class="flex items-center gap-2 text-fg no-underline hover:no-underline lg:hidden">
            <img src="img/app_icon.png" alt="" class="h-7 w-7 rounded-md bg-accent p-0.5" />
            <span class="font-display text-sm font-bold tracking-wide">{{sharedService.themero ? "Themero" : "Dauntless"}} <span class="text-accent">LB</span></span>
        </a>

        <div class="relative ml-auto">
            <button class="btn btn-secondary py-1.5 pl-1.5 pr-3" (click)="menuOpen = !menuOpen" aria-haspopup="menu" [attr.aria-expanded]="menuOpen">
                <span class="flex h-7 w-7 items-center justify-center overflow-hidden rounded-md bg-bg text-muted">
                    <img *ngIf="me && me.guild.id > 0 && me.guild.iconFilename; else userIcon" class="h-7 w-7 object-cover" [src]="sharedService.getImgPath(me.guild.iconFilename, 'guilds')" alt="">
                    <ng-template #userIcon><i class="fa-solid fa-user text-xs"></i></ng-template>
                </span>
                <span class="hidden max-w-[12rem] truncate sm:inline" *ngIf="me && me.player.id > 0">{{sharedService.themero ? "Themero" : me.player.name}}</span>
                <span class="hidden text-xs font-semibold text-muted sm:inline" *ngIf="me && me.guild.id > 0">[{{me.guild.tag}}]</span>
                <i class="fa-solid fa-chevron-down text-[0.6rem] text-muted transition-transform" [class.rotate-180]="menuOpen"></i>
            </button>

            <div *ngIf="menuOpen" class="absolute right-0 mt-2 w-56 overflow-hidden rounded-xl border border-line bg-surface py-1 shadow-card" role="menu">
                <div *ngIf="(me && me.player.id > 0) || (me && me.guild.id > 0)" class="border-b border-line px-3 py-2.5 sm:hidden">
                    <div class="truncate text-sm font-medium" *ngIf="me && me.player.id > 0">{{sharedService.themero ? "Themero" : me.player.name}}</div>
                    <div class="text-xs text-muted" *ngIf="me && me.guild.id > 0">[{{me.guild.tag}}]</div>
                </div>

                <a *ngIf="me && me.player.id > 0" [routerLink]="'/players/' + me.player.id" class="menu-item" role="menuitem" (click)="menuOpen = false">
                    <i class="fa-solid fa-user"></i> My profile
                </a>
                <a *ngIf="me && me.guild.id > 0" [routerLink]="'/guilds/' + me.guild.id" class="menu-item" role="menuitem" (click)="menuOpen = false">
                    <i class="fa-solid fa-users"></i> My guild
                </a>

                <div *ngIf="(me && me.player.id > 0) || (me && me.guild.id > 0)" class="my-1 border-t border-line"></div>
                <a routerLink="/settings" class="menu-item" role="menuitem" (click)="menuOpen = false">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
                <div *ngIf="!me || (me.player.id <= 0 && me.guild.id <= 0)" class="border-t border-line px-3 py-2 text-xs leading-relaxed text-muted">
                    Tip: use <i class="fa-solid fa-lock-open"></i> on a player or guild page to set it as yours.
                </div>
            </div>
        </div>
    </div>
</header>
