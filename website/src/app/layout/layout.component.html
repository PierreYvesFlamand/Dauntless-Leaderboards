<!-- From lg: app shell, header & footer always visible, only the content area scrolls -->
<div class="min-h-screen lg:h-screen lg:overflow-hidden">
    <!-- Mobile backdrop -->
    <div *ngIf="sidebarOpen" class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden" (click)="sidebarOpen = false"></div>

    <dl-sidebar [open]="sidebarOpen" (close)="sidebarOpen = false" />

    <!-- overflow-x-clip: never a horizontal page scroll (clip, not hidden, keeps the sticky header working) -->
    <div class="flex min-h-screen flex-col overflow-x-clip lg:h-screen lg:pl-64">
        <dl-header *ngIf="databaseService.data.loaded" class="shrink-0" (toggleSidebar)="sidebarOpen = !sidebarOpen" />

        <div #scrollArea class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
            <main class="page mx-auto flex w-full max-w-7xl flex-1 flex-col px-4 py-6 sm:px-6 lg:min-h-0 lg:px-8 lg:pb-4">
                <router-outlet *ngIf="databaseService.data.loaded" />

                <div *ngIf="!databaseService.data.loaded" class="flex min-h-[60vh] flex-col items-center justify-center text-center">
                    <img src="img/app_icon.svg" alt="" class="h-16 w-16 animate-pulse" />
                    <h2 class="mt-5 font-display text-xl font-semibold">{{'common.loading' | t}}</h2>
                    <p class="mt-1 text-sm text-muted">{{'layout.loadingText' | t}}</p>
                </div>
            </main>
        </div>

        <dl-footer class="shrink-0" />
    </div>
</div>
