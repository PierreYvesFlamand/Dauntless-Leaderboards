<svg class="block w-full" [attr.width]="width" [attr.height]="height" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" [attr.aria-label]="'components.trendChart.ariaLabel' | t" (mouseleave)="hoverIndex = null">
    <!-- Grid & y axis (solid hairlines) -->
    <g *ngFor="let tick of ticks">
        <line class="stroke-line" [attr.x1]="padding.left" [attr.x2]="width - padding.right" [attr.y1]="y(tick)" [attr.y2]="y(tick)" stroke-width="1" />
        <text class="fill-muted text-[10px] tabular-nums" [attr.x]="padding.left - 8" [attr.y]="y(tick)" text-anchor="end" dominant-baseline="middle">{{formatTick(tick)}}</text>
    </g>

    <!-- X axis labels -->
    <ng-container *ngFor="let point of points; let i = index">
        <text *ngIf="showXLabel(i)" class="fill-muted text-[10px] tabular-nums" [attr.x]="x(i)" [attr.y]="height - 8" text-anchor="middle">{{point.label}}</text>
    </ng-container>

    <!-- Crosshair -->
    <line *ngIf="hoverIndex !== null" class="stroke-muted/50" [attr.x1]="hoverX" [attr.x2]="hoverX" [attr.y1]="padding.top" [attr.y2]="height - padding.bottom" stroke-width="1" />

    <!-- Area wash + line -->
    <path class="fill-chart/10" [attr.d]="areaPath" />
    <path class="stroke-chart" [attr.d]="linePath" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Markers -->
    <ng-container *ngIf="showMarkers">
        <circle *ngFor="let point of points; let i = index" class="fill-chart stroke-surface" [attr.cx]="x(i)" [attr.cy]="y(point.value)" r="4" stroke-width="2" />
    </ng-container>
    <circle *ngIf="hoverPoint" class="fill-chart stroke-surface" [attr.cx]="hoverX" [attr.cy]="hoverY" r="6" stroke-width="2" />

    <!-- Hit targets: full-height column per point -->
    <rect *ngFor="let point of points; let i = index" fill="transparent" [attr.x]="x(i) - step / 2" y="0" [attr.width]="step || plotWidth" [attr.height]="height" (mouseenter)="hoverIndex = i" />
</svg>

<div *ngIf="hoverPoint as hp" class="pointer-events-none absolute top-1 z-10 -translate-x-1/2 whitespace-nowrap rounded-lg border border-line bg-surface px-2.5 py-1.5 text-xs shadow-card" [style.left.px]="tooltipLeft">
    <div class="font-semibold">{{hp.label}}</div>
    <div class="text-muted" [innerHTML]="valueText(hp)"></div>
    <div *ngIf="hp.tooltip" class="text-muted">{{hp.tooltip}}</div>
</div>
