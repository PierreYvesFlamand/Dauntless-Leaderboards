<!-- gap: active buttons don't touch; the last shown era can't be turned off -->
<div class="segmented flex-nowrap gap-1" role="group" [attr.aria-label]="'common.era' | t">
    <button *ngFor="let era of eras" class="whitespace-nowrap disabled:cursor-not-allowed" [attr.aria-pressed]="isShown(era.id)" [class.active]="isShown(era.id)" [disabled]="isOnlyShown(era.id)" [title]="(era.label | t) + ' · ' + (era.weeks | t: sharedService.getEraWeeksParams(era))" (click)="toggle(era.id)">
        <span class="sm:hidden">{{era.short | t}}</span>
        <span class="hidden sm:inline">{{era.label | t}}</span>
    </button>
</div>
