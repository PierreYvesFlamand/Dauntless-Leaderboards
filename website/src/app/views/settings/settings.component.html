<div class="page-header">
    <div>
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">Stored in your browser only.</p>
    </div>
</div>

<div class="mx-auto max-w-3xl space-y-6">
    <section class="card">
        <div class="card-header">
            <h2 class="card-title select-none" (click)="onThemeroClick()">General</h2>
        </div>
        <div class="divide-y divide-line">
            <label class="setting-row" for="theme">
                <span class="setting-icon"><i class="fa-solid fa-moon"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Dark mode</span>
                    <span class="block text-xs text-muted">Switch between the dark and light theme</span>
                </span>
                <span class="switch">
                    <input type="checkbox" id="theme" [ngModel]="sharedService.theme === 'dark'" (ngModelChange)="sharedService.updateTheme($event ? 'dark' : 'light')">
                    <span></span>
                </span>
            </label>
        </div>
    </section>

    <section class="card">
        <div class="card-header">
            <h2 class="card-title"><img class="h-5 w-5" src="img/trial_icon.png" alt="" /> Trials</h2>
        </div>
        <div class="divide-y divide-line">
            <div class="setting-row">
                <span class="setting-icon"><i class="fa-solid fa-stopwatch"></i></span>
                <label class="flex-1" for="trial-decimals">
                    <span class="block font-medium">Trial time decimals</span>
                    <span class="block text-xs text-muted">Number of decimals displayed for completion times (1, 2 or 3)</span>
                </label>
                <input id="trial-decimals" class="input w-20 text-center" type="number" min="1" max="3" [ngModel]="sharedService.trialDecimals" (ngModelChange)="sharedService.updateTrialDecimals($event)" />
            </div>

            <label class="setting-row" for="showPreAwakening">
                <span class="setting-icon"><i class="fa-solid fa-hourglass-start"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Show Pre Awakening Trials</span>
                    <span class="block text-xs text-muted">Weeks before 282</span>
                </span>
                <span class="switch">
                    <input type="checkbox" id="showPreAwakening" [ngModel]="sharedService.showPreAwakening === true" (ngModelChange)="sharedService.updateShowPreAwakening($event ? true : false)">
                    <span></span>
                </span>
            </label>

            <label class="setting-row" for="showPostAwakening">
                <span class="setting-icon"><i class="fa-solid fa-hourglass-end"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Show Post Awakening Trials</span>
                    <span class="block text-xs text-muted">Week 282 and after</span>
                </span>
                <span class="switch">
                    <input type="checkbox" id="showPostAwakening" [ngModel]="sharedService.showPostAwakening === true" (ngModelChange)="sharedService.updateShowPostAwakening($event ? true : false)">
                    <span></span>
                </span>
            </label>
        </div>
    </section>

    <section class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fa-solid fa-star text-fav"></i> Favorites</h2>
            <a class="btn btn-secondary btn-sm" routerLink="/favorites">Manage <i class="fa-solid fa-arrow-right text-[0.65rem]"></i></a>
        </div>
        <div class="divide-y divide-line">
            <label class="setting-row" for="favoritesOnly">
                <span class="setting-icon"><i class="fa-solid fa-filter"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Show favorites only</span>
                    <span class="block text-xs text-muted">Restrict the Guilds, Players and Statistics pages to your favorites</span>
                </span>
                <span class="switch">
                    <input type="checkbox" id="favoritesOnly" [ngModel]="sharedService.favoritesOnly" (ngModelChange)="sharedService.updateFavoritesOnly($event ? true : false)">
                    <span></span>
                </span>
            </label>
        </div>
    </section>

    <section class="card">
        <div class="card-header">
            <h2 class="card-title">Data</h2>
        </div>
        <div class="divide-y divide-line">
            <div class="setting-row">
                <span class="setting-icon"><i class="fa-solid fa-download"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Export</span>
                    <span class="block text-xs text-muted">Download the full dataset (expect ~35Mb .json file)</span>
                </span>
                <a class="btn btn-secondary" href="data/allData.json" download="Dauntless Leaderbaords Dataset" target="_blank">Download</a>
            </div>
            <div class="setting-row">
                <span class="setting-icon"><i class="fa-solid fa-rotate"></i></span>
                <span class="flex-1">
                    <span class="block font-medium">Refresh</span>
                    <span class="block text-xs text-muted">Clear the cached data and reload the website</span>
                </span>
                <button class="btn btn-primary" (click)="forceWebsiteRefresh()">Force refresh</button>
            </div>
        </div>
    </section>
</div>
