<div class="page-header">
    <div>
        <h1 class="page-title">{{'nav.players' | t}}</h1>
        <p class="page-subtitle">{{'players.subtitle' | t}}</p>
    </div>
</div>

<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex w-full flex-col gap-2 sm:w-auto">
        <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-muted"></i>
            <input class="input pl-9" [placeholder]="'players.search' | t" [(ngModel)]="filters.textSearch" (ngModelChange)="filters.page = 1; textSearchUpdate.next($event)" [attr.aria-label]="'players.search' | t" />
        </div>
        <div class="flex items-center gap-2">
            <dl-era-selector (eraChange)="filters.page = 1; applyFilter();" />
            <dl-favorites-toggle (favoritesOnlyChange)="filters.page = 1; applyFilter();" />
        </div>
    </div>
    <dl-pagination [page]="filters.page" [total]="total" label="players" (pageChange)="filters.page = $event; applyFilter();" />
</div>

<div class="table-wrap fill" style="--thead-h: 53px">
    <table class="data-table">
        <thead>
            <tr>
                <th>{{'common.player' | t}}</th>
                <th *ngFor="let column of sortColumns" class="th-sort w-28" (click)="changeFilter(column.key)">
                    <span class="flex items-center gap-2">
                        <span>{{column.group | t}}<br><span class="text-fg/80">{{column.label | t}}</span></span>
                        <i class="fa-solid {{getArrowIcon(column.key)}} ml-auto" [class.text-accent]="filters.orderByField === column.key"></i>
                    </span>
                </th>
            </tr>
        </thead>

        <tbody>
            <tr *ngIf="isLoading">
                <td colspan="7">
                    <div class="spinner"><i class="fa-solid fa-rotate fa-spin"></i></div>
                </td>
            </tr>
            <tr *ngIf="!isLoading && !players.length">
                <td colspan="7" class="py-8 text-center text-sm text-muted">
                    <span *ngIf="sharedService.favoritesOnly; else noResult" [innerHTML]="'players.noFavorite' | t: { icon: starIcon }"></span>
                    <ng-template #noResult>{{'players.noResult' | t}}</ng-template>
                </td>
            </tr>
            <tr *ngFor="let player of players" [enhancedRouterLink]="'/players/' + player.id" role="button" [class.is-me]="player.id === sharedService.playerId" [class.is-fav]="sharedService.hasFavoritePlayer(player.id) && player.id !== sharedService.playerId">
                <td>
                    <span class="flex flex-wrap items-center gap-x-4 gap-y-1">
                        <span *ngFor="let player_name of player.playerNames" class="inline-flex items-center gap-1.5 font-medium">
                            {{sharedService.themero ? "Themero" : player_name.name}}
                            <img class="ico-sm platform-icon opacity-80" [src]="sharedService.getImgPath(player_name.platformId + '.png', 'platforms')" alt="" />
                        </span>
                    </span>
                </td>
                <td *ngFor="let column of sortColumns" class="tabular-nums" [class.font-semibold]="filters.orderByField === column.key">{{getStat(player, column.key)}}</td>
            </tr>
        </tbody>
    </table>
</div>
