<div class="page-header">
    <div>
        <h1 class="page-title">Guilds</h1>
        <p class="page-subtitle">Every guild that ever ranked in the Gauntlet.</p>
    </div>
</div>

<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="relative w-full sm:max-w-xs">
        <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-muted"></i>
        <input class="input pl-9" placeholder="Search for a guild" [ngModel]="''" (ngModelChange)="filters.textSearch = $event; filters.page = 1; applyFilter();" aria-label="Search for a guild" />
    </div>
    <dl-pagination [page]="filters.page" [total]="total" label="guilds" (pageChange)="filters.page = $event; applyFilter();" />
</div>

<div class="table-wrap fill">
    <table class="data-table">
        <thead>
            <tr>
                <th>Guild</th>
                <th class="th-sort w-36" (click)="changeFilter('rating')">
                    <span class="flex items-center gap-2">
                        Guild Score
                        <i class="fa-solid fa-circle-info normal-case" [title]="sharedService.guildScoreTooltip"></i>
                        <i class="fa-solid {{getArrowIcon('rating')}} ml-auto" [class.text-accent]="filters.orderByField === 'rating'"></i>
                    </span>
                </th>
                <th *ngFor="let column of sortColumns" class="th-sort w-28" (click)="changeFilter(column.key)">
                    <span class="flex items-center gap-2">
                        {{column.label}}
                        <i class="fa-solid {{getArrowIcon(column.key)}} ml-auto" [class.text-accent]="filters.orderByField === column.key"></i>
                    </span>
                </th>
            </tr>
        </thead>

        <tbody>
            <tr *ngIf="isLoading">
                <td colspan="6">
                    <div class="spinner"><i class="fa-solid fa-rotate fa-spin"></i></div>
                </td>
            </tr>
            <tr *ngFor="let guild of guilds" [enhancedRouterLink]="'/guilds/' + guild.id" role="button" [class.is-me]="guild.id === sharedService.guildId" [class.is-fav]="sharedService.hasFavoriteGuild(guild.id) && guild.id !== sharedService.guildId">
                <td>
                    <dl-guild-tag [iconFilename]="guild.iconFilename" [name]="guild.name" [tag]="guild.tag" />
                </td>
                <td class="font-semibold tabular-nums">{{guild.rating.toFixed(1)}}</td>
                <td class="tabular-nums">{{guild.nbrTop1}}</td>
                <td class="tabular-nums">{{guild.nbrTop5}}</td>
                <td class="tabular-nums">{{guild.nbrTop100}}</td>
                <td class="tabular-nums">{{guild.totalLevelCleared}}</td>
            </tr>
        </tbody>
    </table>
</div>
